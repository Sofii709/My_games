<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра - Морський бій</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">
        <div class="top-nav">
            <a href="index.html" class="back-btn">← Назад до ігор</a>
        </div>

        <button id="startBtn" class="start-btn" onclick="startGame()">Почати гру</button>

        <div id="gameConsole" class="console-box" style="display: none;"></div>

        <div class="game-description">
            <h2>Опис гри</h2>
            <p>Класичний морський бій, проте лише з одним кораблем від 1 до 4-палубного, та з певною кількістю спроб. Гра одностороння де тільки ви шукаєте корабель. (В майбутньому це буде виглядати більш гарно та з полями)</p>
        </div>

        <div class="source-code-block">
            <h2>Код цієї гри (JavaScript)</h2>
            <textarea class="readonly-code" readonly>let maxShots = 15;
let shotsLeft = maxShots;
let hits = 0;

function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

let shipSize = rand(1, 4);
let direction = rand(0, 1);

let startRow = rand(1, 10);
let startCol = rand(1, 10);

if (direction == 0 && (startCol + shipSize) > 11) {
    startCol = 11 - shipSize;
}
if (direction == 1 && (startRow + shipSize) > 11) {
    startRow = 11 - shipSize;
}

let s1Row = startRow, s1Col = startCol;
let s2Row = -1, s2Col = -1; 
let s3Row = -1, s3Col = -1;
let s4Row = -1, s4Col = -1;

if (shipSize >= 2) {
    if (direction == 0) {
        s2Row = startRow; s2Col = startCol + 1; 
    }
    if (direction == 1) { 
        s2Row = startRow + 1; s2Col = startCol; 
    }
}
if (shipSize >= 3) {
    if (direction == 0) {
        s3Row = startRow; s3Col = startCol + 2;
    }
    if (direction == 1) {
        s3Row = startRow + 2; s3Col = startCol; 
    }
}
if (shipSize == 4) {
    if (direction == 0) {
        s4Row = startRow; s4Col = startCol + 3; 
    }
    if (direction == 1) {
        s4Row = startRow + 3; s4Col = startCol; 
    }
}

let s1Hit = false;
let s2Hit = false;
let s3Hit = false;
let s4Hit = false;


console.log("x " + startRow + "y " + startCol)

while (shotsLeft > 0 && hits < shipSize) {
    
    let rowInput = prompt("Залишилось спроб: " + shotsLeft + " Влучено палуб: " + hits + " з " + shipSize + " Введіть x:");
    let colInput = prompt("Введіть y:");

    if (rowInput == null || colInput == null) {
        alert("Гру скасовано!");
        break;
    }

    let row = parseInt(rowInput);
    let col = parseInt(colInput);

    if (isNaN(row) || isNaN(col)) {
        alert("Помилка! Вводьте тільки числа.");
        continue; 
    }

    if (row < 1 || row > 10 || col < 1 || col > 10) {
        alert("Помилка. Координати мають бути від 1 до 10.");
        continue;
    }

    let isCurrentHit = false;

    if (row == s1Row && col == s1Col) {
        if (s1Hit == true) {
            alert("Ви вже влучали в цю палубу. Спроба не зараховується.");
            continue;
        }
        s1Hit = true;
        isCurrentHit = true;
    }
    else if (row == s2Row && col == s2Col && shipSize >= 2) {
        if (s2Hit == true) {
            alert("Ви вже влучали в цю палубу. Спроба не зараховується.");
            continue;
        }
        s2Hit = true;
        isCurrentHit = true;
    }
    else if (row == s3Row && col == s3Col && shipSize >= 3) {
        if (s3Hit == true) {
            alert("Ви вже влучали в цю палубу. Спроба не зараховується");
            continue;
        }
        s3Hit = true;
        isCurrentHit = true;
    }
    else if (row == s4Row && col == s4Col && shipSize == 4) {
        if (s4Hit == true) {
            alert("Ви вже влучали в цю палубу. Спроба не зараховується");
            continue;
        }
        s4Hit = true;
        isCurrentHit = true;
    }

    shotsLeft = shotsLeft - 1;

    if (isCurrentHit == true) {
        hits = hits + 1;
        alert("Попали");
    } else {
        alert("Повз");
    }
}

if (hits == shipSize) {
    alert("Ви повністю знищили корабель");
} else if (shotsLeft == 0) {
    alert("У вас закінчилися спроби. Ви програли. Корабель починався на рядку " + startRow + ", стовпчику " + startCol);
}</textarea>
        </div>
    </div>

    <script src="js/boat.js"></script>

</body>

</html>
