<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра — Крадіжка</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">
        <div class="top-nav">
            <a href="index.html" class="back-btn">← Назад до ігор</a>
        </div>

        <button id="startBtn" class="start-btn" onclick="startGame()">Почати гру</button>

        <div id="gameConsole" class="console-box" style="display: none;"></div>

        <div class="game-description">
            <h2>Опис гри</h2>
            <p>Ваше завдання- забрати всі гроші з банку та не дати поліції схопити вас чи камерам побачити вас. (Так як гра в розробці поки що можна просто побалуватись з забиранням грошей)</p>
        </div>

        <div class="source-code-block">
            <h2>Код цієї гри (JavaScript)</h2>
            <textarea class="readonly-code" readonly>function startGame() {
    let balance = 100500;
    let cameraOn = true;
    let totalStolen = 0;

    function steal(amount) { 
        cameraOn = !cameraOn;
        totalStolen += amount;
        balance -= amount;
        cameraOn = true;
        return amount;
    }

    let amount = steal(20000);
    alert("Criminal: you stole " + amount + ". Remaining balance: " + balance);

    while (balance > 0) {
        let userInput = prompt("Скільки ще ви хочете вкрасти? (Залишилось у банку: " + balance + ")");

        if (userInput === null) {
            break;
        }

        let nextAmount = Number(userInput);

        if (userInput.trim() === "" || isNaN(nextAmount) || nextAmount <= 0) {
            alert("Помилка! Введіть число більше нуля.");
            continue;
        }

        if (nextAmount > balance) {
            alert("У банку немає стільки грошей! Максимально доступно: " + balance);
            continue;
        }

        let stolenNow = steal(nextAmount);
        alert("Criminal: you stole " + stolenNow + ". Remaining balance: " + balance);
    }

    if (balance === 0) {
        alert("Банк повністю пограбовано! Всього вкрадено: " + totalStolen);
    } else {
        alert("Гру завершено. Всього вкрадено: " + totalStolen + ". Залишок у банку: " + balance);
    }

    console.log("Stolen: " + totalStolen);
    console.log("Bank balance: " + balance);
}
</textarea>
        </div>
    </div>

    <script src="js/criminal.js"></script>

</body>

</html>
